<!doctype html>
<!-- Source for brand/social.png (1200 x 630). Re-render with a headless browser at that window size. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@500;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #cbe4f2; }
  .wrap { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 612px 1fr; gap: 12px; padding: 24px; box-sizing: border-box; }
  .card { background: #f1e3b5; border-radius: 24px; padding: 40px 48px 44px; display: flex; flex-direction: column; font-family: "Albert Sans", sans-serif; color: #0a0a0a; }
  .week { display: flex; justify-content: space-between; }
  .week i { width: 52px; height: 52px; border-radius: 50%; display: block; }
  .t { background: #b0298f; } .c { background: #0a0a0a; } .r { background: #cbe4f2; }
  .word { margin-top: auto; height: 40px; width: auto; align-self: flex-start; }
  h1 { margin: 26px 0 0; font-weight: 600; font-size: 62px; line-height: 1; letter-spacing: -0.035em; }
  p { margin: 22px 0 0; font-weight: 500; font-size: 26px; line-height: 1.25; letter-spacing: -0.01em; }
  .stage { position: relative; overflow: hidden; background: #0a0a0a; border-radius: 24px; }
  .stage i { position: absolute; border-radius: 50%; display: block; }
  .stage .sand { width: 520px; height: 520px; background: #f1e3b5; left: -262px; top: 31px; }
  .stage .mag { width: 520px; height: 520px; background: #b0298f; left: 325px; top: 31px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="week"><i class="t"></i><i class="c"></i><i class="t"></i><i class="c"></i><i class="r"></i><i class="t"></i><i class="r"></i></div>
    <img class="word" src="kinmova-wordmark.svg" alt="kinmova">
    <h1>See who’s slipping<br>before they quit</h1>
    <p>Class booking and coaching in one app. Founding studios get 3 months free.</p>
  </div>
  <div class="stage"><i class="sand"></i><i class="mag"></i></div>
</div>
</body>
</html>
