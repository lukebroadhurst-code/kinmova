<!doctype html>
<!-- Source for brand/facebook-cover.png (1640 x 624). Key content stays in the middle 1100px so phones don't crop it. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@500;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1640px; height: 624px; overflow: hidden; background: #cbe4f2; }
  .wrap { width: 1640px; height: 624px; display: grid; place-items: start center; padding-top: 64px; box-sizing: border-box; font-family: "Albert Sans", sans-serif; color: #0a0a0a; }
  .inner { display: grid; justify-items: center; gap: 34px; }
  .week { display: flex; gap: 28px; }
  .week i { width: 76px; height: 76px; border-radius: 50%; display: block; }
  .t { background: #b0298f; } .c { background: #0a0a0a; } .r { background: #f1e3b5; }
  h1 { margin: 0; font-weight: 600; font-size: 64px; line-height: 1; letter-spacing: -0.035em; }
  p { margin: -14px 0 0; font-weight: 500; font-size: 26px; letter-spacing: -0.01em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="inner">
    <div class="week"><i class="t"></i><i class="c"></i><i class="t"></i><i class="c"></i><i class="r"></i><i class="t"></i><i class="r"></i></div>
    <h1>See who’s slipping before they quit</h1>
    <p>Class booking and coaching between classes, for small studios and clubs</p>
  </div>
</div>
</body>
</html>
